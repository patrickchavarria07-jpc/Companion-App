name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # The Electron binary is not needed to lint, test, or compile.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned smoke build; signing needs release credentials.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package unpacked app
        run: npx electron-builder --dir --publish never
      - name: Verify packaged ASAR and unpacked pdf.js assets
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const found = [];
            (function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else found.push(full);
              }
            })('release');
            if (!found.some(f => f.endsWith('app.asar'))) throw new Error('Missing app.asar');
            if (!found.some(f => f.includes('app.asar.unpacked') && f.endsWith('.bcmap'))) {
              throw new Error('Missing unpacked pdfjs-dist .bcmap assets');
            }
          "
